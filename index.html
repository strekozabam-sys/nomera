.snow-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.snowflake{position:absolute;top:-24px;color:#eaf5ff;text-shadow:0 0 10px #b8dcffb0;opacity:.75;animation:snowfall linear infinite;will-change:transform}
@keyframes snowfall{to{transform:translate3d(var(--drift),110vh,0) rotate(360deg)}}
.sq,.pill,.tile,.pick,.card{transition:transform .18s ease,border-color .18s ease,filter .18s ease}
button:active,.tile:active{transform:scale(.975)}
.tile{background:linear-gradient(155deg,#1b3c70,#111a30);border-color:#304b78}.tile span{background:#0d1425}
.tile.ev{display:none}
.pop{animation:rev 1.35s cubic-bezier(.16,1,.3,1)}
#pb .pop:has(.plate.pol),#pb .pop:has(.plate.mil){animation-duration:1.35s}
.menu-icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:#dbeafe;filter:drop-shadow(0 2px 5px #0006)}
.menu-icon svg{width:30px;height:30px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.online-status{display:inline-flex;align-items:center;gap:6px;color:#86efac;font-size:12px}.online-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
@media(prefers-reduced-motion:reduce){.snowflake{display:none}}

/* Snow stays behind every screen and never covers plates or controls */
.snow-layer{z-index:1!important;position:absolute;inset:0;pointer-events:none;overflow:hidden}.scr>.glow{z-index:0;position:absolute;inset:0;pointer-events:none}.scr>*:not(.glow):not(.snow-layer){position:relative;z-index:2}
.rarity-flash{position:absolute;z-index:8;left:50%;top:38%;transform:translate(-50%,-50%);width:max-content;max-width:95%;text-align:center;font-weight:1000;letter-spacing:.08em;font-size:clamp(18px,5vw,30px);color:var(--rarity-color);text-shadow:0 0 8px var(--rarity-color),0 0 24px var(--rarity-color),0 3px 4px #000;pointer-events:none;animation:rarityReveal 2.2s cubic-bezier(.16,1,.3,1) both}
@keyframes rarityReveal{0%{opacity:0;transform:translate(-50%,-20%) scale(.25) rotate(-8deg);filter:blur(12px)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(2deg);filter:blur(0)}38%{transform:translate(-50%,-50%) scale(.96)}55%{transform:translate(-50%,-50%) scale(1.04)}100%{opacity:0;transform:translate(-50%,-75%) scale(1.05)}}
.rarity-epic #pb{animation:epicPulse 1.1s ease-in-out 2}.rarity-legendary #pb{animation:legendPulse 1.15s ease-in-out 2}
@keyframes epicPulse{0%,100%{filter:drop-shadow(0 0 0 #a855f7)}50%{filter:drop-shadow(0 0 25px #a855f7)}}
@keyframes legendPulse{0%,100%{filter:drop-shadow(0 0 0 #f59e0b)}50%{filter:drop-shadow(0 0 34px #f59e0b)}}

<script>

const REG="01 02 102 702 03 04 05 06 07 08 09 10 11 111 12 13 113 14 15 16 116 716 17 18 19 21 121 22 122 23 93 123 24 84 88 124 25 125 26 126 27 28 29 30 31 32 33 34 134 35 36 136 37 38 85 138 39 91 40 41 82 42 142 43 44 45 46 47 147 48 49 50 90 150 190 750 790 51 52 152 53 54 154 55 155 56 156 57 58 59 81 159 60 61 161 62 63 163 763 64 164 65 66 96 196 67 68 69 70 71 72 172 73 173 74 174 75 80 76 77 97 99 177 197 199 777 797 799 978 78 98 178 79 83 86 186 87 89 92 94 95".split(" ");

const LU="АВЕІКМНОРСТХ",LA="ABCDEFGHIJKLMNOPQRSTUVWXYZ",CN={ru:{n:"Россия",f:""},ua:{n:"Украина",f:"ua"},ae:{n:"ОАЭ (Дубай)",f:"ae"},am:{n:"Армения",f:"am"},ge:{n:"Грузия",f:"ge"},kz:{n:"Казахстан",f:"kz"},az:{n:"Азербайджан",f:"az"},uz:{n:"Узбекистан",f:"uz"},kg:{n:"Кыргызстан",f:"kg"},tj:{n:"Таджикистан",f:"tj"},tr:{n:"Турция",f:"tr"},us:{n:"США",f:"us"},ng:{n:"Нигерия",f:"ng"},af:{n:"Афганистан",f:"af"},pt:{n:"Португалия",f:"pt"},ady:{n:"Адыгея",f:"ady"}},CS={ru:1,ua:1,ae:8,am:1,ge:1,kz:1,az:1,uz:1,kg:1,tj:1,tr:1,us:1,ng:1,af:1,pt:1,ady:1};
const UAR=[["АА","Киев"],["КА","Киев"],["ТТ","Киев"],["АІ","Киевская обл."],["КІ","Киевская обл."],["ТІ","Киевская обл."],["АХ","Харьковская обл."],["КХ","Харьковская обл."],["ХХ","Харьковская обл."],["АЕ","Днепропетровская обл."],["КЕ","Днепропетровская обл."],["ЕЕ","Днепропетровская обл."],["ВН","Одесская обл."],["НН","Одесская обл."],["АР","Запорожская обл."],["КР","Запорожская обл."],["РР","Запорожская обл."],["ВС","Львовская обл."],["НС","Львовская обл."],["СС","Львовская обл."],["АВ","Винницкая обл."],["КВ","Винницкая обл."],["ВВ","Винницкая обл."],["ВІ","Полтавская обл."],["НІ","Полтавская обл."],["ІІ","Полтавская обл."],["АК","Крым"],["КК","Крым"],["ТК","Крым"]];
const EM={dxb:{n:"Дубай",ar:"دبي",en:"DUBAI",f:1},abu:{n:"Абу-Даби",ar:"أبوظبي",en:"ABU DHABI",f:.9},shj:{n:"Шарджа",ar:"الشارقة",en:"SHARJAH",f:.12},ajm:{n:"Аджман",ar:"عجمان",en:"AJMAN",f:.08},rak:{n:"Рас-эль-Хайма",ar:"رأس الخيمة",en:"RAS AL KHAIMAH",f:.06},uaq:{n:"Умм-эль-Кайвайн",ar:"أم القيوين",en:"UMM AL QUWAIN",f:.05},fuj:{n:"Эль-Фуджайра",ar:"الفجيرة",en:"FUJAIRAH",f:.04}};
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const LS={get(k){try{return window.localStorage.getItem(k)}catch(e){return null}},set(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}};
const DEF=()=>({m:5000,usd:0,inv:[],luck:0,spd:0,au:0,as:0,reg:"",cn:"ru",v:2,ty:{civ:1,taxi:1,pol:1,mil:1},sort:"p",dir:-1,n:0,fr:0}),S=DEF();let U=LS.get("nomera_cur")||"";
const rd=k=>{try{return JSON.parse(LS.get(k)||"{}")}catch(e){return{}}};
function loadU(u){for(const k in S)delete S[k];const d=rd("nomera_d_"+u);if(d.v!==2){d.as=0;d.v=2}Object.assign(S,DEF(),d);if(!cOpen(S.cn,u)){S.cn="ru";S.reg=""}S.inv.forEach(p=>{if(p.q!==2)mkV(p);p.r=tier(p)})}
const save=()=>{if(U)LS.set("nomera_d_"+U,JSON.stringify(S))};
async function hs(p,s){const t=s+p;try{return[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of t)h=(h*33^c.charCodeAt(0))>>>0;return""+h}}
async function auth(reg){const l=$("al").value.trim().toLowerCase(),p=$("ap").value,er=m=>$("ae").textContent=m;
 {const sv=$("as").value.trim().replace(/\/+$/,"");if(sv){if(!/^https?:\/\//i.test(sv))return er("Адрес сервера должен начинаться с http:// или https://");try{localStorage.setItem("nomera_api_base",sv)}catch(e){}}}
 if(!/^[a-z0-9_а-яё]{3,16}$/.test(l)||p.length<4)return er("Логин 3–16 символов, пароль от 4");
 try{const r=await apiReq(reg?"/api/register":"/api/login",{login:l,password:p});LS.set("nomera_token",r.token);LS.set("nomera_cur",l);U=l;loadU(l);er("");$("ap").value="";$("au").classList.remove("on");setAuto();intro();go("gen");return}
 catch(e){
  // Offline mode: lets the game work when the HTML is opened without the server.
  if(!/Failed to fetch|NetworkError|fetch|Load failed|Сетевой|Сервер недоступен|Сервер игры не настроен|Ошибка ответа сервера|Unexpected token|JSON/i.test(String(e.message)))return er(e.message||"Ошибка входа");
  const accounts=rd("nomera_local_accounts"),hash=await hs("local:",p);
  if(reg){if(accounts[l])return er("Такой локальный логин уже существует");accounts[l]=hash;LS.set("nomera_local_accounts",JSON.stringify(accounts))}
  else if(!accounts[l])return er("Локальный аккаунт не найден. Нажми «Регистрация».");
  else if(accounts[l]!==hash)return er("Неверный пароль");
  U=l;LS.set("nomera_cur",l);LS.set("nomera_token","");loadU(l);er("Офлайн-режим: онлайн-функции отключены");$("ap").value="";setTimeout(()=>{$("au").classList.remove("on");intro();go("gen")},900);setAuto();return
 }}

const nm=(c,cn=S.cn)=>cn==="ua"?(UAR.find(x=>x[0]===c)||[0,c])[1]:cn==="ae"?(EM[c]||{n:c}).n:(NM[c]||NM[c.slice(-2)]||"Регион "+c);
const hh=c=>{let h=7;for(const x of c)h=(h*31+x.charCodeAt(0))%97;return h/97};
const rm=(c,cn=S.cn)=>cn==="ae"?(EM[c]?EM[c].f:.05):cn==="ua"?(c==="АА"||c==="КА"||c==="ТТ"?1:.12+hh(c)*.28):/^(50|150|190|750|790)$/.test(c)?.5:TOP.has(c)?1:.1+hh(c)*.25;
const REGS=[...REG].sort((a,b)=>rm(b,"ru")-rm(a,"ru"));
const TH=[0,5e3,3e4,3e5,2.5e6];
// Foreign plates use their own, reachable rarity/value curve; RU, UA and Dubai keep the original economy.
const FTH=[0,600,2500,12000,60000];
const tier=p=>{const c=p.cn||"ru",a=(!["ru","ua","ae"].includes(c)?FTH:TH);return a.reduce((r,t,i)=>p.v>=t*(CS[c]||1)?i:r,0)};
const nice=v=>{const k=Math.max(0,String(Math.round(v)).length-3);return Math.round(v/10**k)*10**k};
const txt=p=>{const c=p.cn||"ru",L=p.L||"",d=p.d||"",r=p.reg||"";
 if(c==="ge")return `${L.split("-")[0]||"AB"}-${d||"123"}-${L.split("-")[1]||"CD"}`;
 if(c==="kz")return `${d} ${L} ${r}`;
 if(c==="az")return `${r}-${L}-${d}`;
 if(c==="uz")return `${r} ${L.slice(0,1)} ${d} ${L.slice(1)}`;
 if(c==="kg")return `${r} ${d} ${L}`;
 if(c==="tj")return `${d} ${L} ${r}`;
 if(c==="tr")return `${r} ${L} ${d}`;
 if(c==="us")return `${L} ${d}`;
 if(c==="ng")return `${L}-${d}-${r}`;
 if(c==="af")return `${r} ${d} ${L}`;
 if(c==="pt")return `${L.slice(0,2)}-${d.slice(0,2)}-${L.slice(2,4)||d.slice(2,4)}`;
 if(c==="am")return `${r} ${L} ${d}`;
 if(c==="ua")return `${r} ${d} ${L}`;
 if(c==="ae")return `${L} ${d}`;
 if(c==="ady")return `${L[0]||"А"}${d}${L.slice(1)||"АА"}`;
 return c==="ru"?(p.ty==="taxi"||p.ty==="pol"?L+" "+d:p.ty==="mil"?d+L:L[0]+d+L.slice(1)):L+" "+d;
};
const plate=(p,sm)=>{const c=p.cn||"ru",z=sm?" sm":"";
 if(c==="ge")return `<div class="plate ua${z}" style="grid-template-columns:13% 87%"><div class="uz" style="background:#1747a6"><u style="background:linear-gradient(#fff 33%,#e31b23 33% 66%,#fff 66%)"></u><i>GE</i></div><div class="pn" style="font-size:clamp(10px,8cqw,24px);letter-spacing:0">${txt(p)}</div></div>`;
 if(c==="ua")return `<div class="plate ua${z}"><div class="uz"><u></u><i>UA</i></div><div class="pn">${txt(p)}</div></div>`;
 if(c==="ae"){const e=EM[p.reg]||EM.dxb;return `<div class="plate ae${z}"><div class="ah"><span>${e.en}</span><span>${e.ar}</span></div><div class="pn">${txt(p)}</div></div>`}
 if(c==="ady")return `<div class="plate ady${z}"><div class="pn">${txt(p)}</div><div class="pz"><b>01</b><span><i>RUS</i><u></u></span></div></div>`;
 if(c!=="ru"){
   const code={kz:"KZ",az:"AZ",uz:"UZ",kg:"KG",tj:"TJ",tr:"TR",us:"USA",ng:"NG",af:"AF",pt:"P",am:"AM",ady:"AD"}[c]||c.toUpperCase();
   const region=(c==="kz"||c==="uz"||c==="kg"||c==="az"||c==="tj"||c==="tr")?p.reg:"";
   const flag=c==="kz"?`<span class="mini-flag kzflag">☀</span>`:c==="kg"?`<span class="mini-flag kgflag">☀</span>`:c==="uz"?`<span class="mini-flag uzflag">☾</span>`:c==="az"?`<span class="mini-flag azflag">☾</span>`:c==="tj"?`<span class="mini-flag tjflag">👑</span>`:"";
   return `<div class="plate foreign ${c}${z}" style="grid-template-columns:${region?"1fr 13%":"1fr"};align-items:stretch"><div class="pn" style="font-size:clamp(10px,7.5cqw,24px);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:clip">${txt(p)}</div>${region?`<div class="foreign-region" style="display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(7px,2.7cqw,10px);line-height:1.1;border-left:1px solid #888">${flag}<b>${region}</b><small>${code}</small></div>`:""}</div>`;
 }
 const r=p.reg||"";return `<div class="plate ${p.ty||"civ"}${z}"><div class="pn">${txt(p)}</div><div class="pz"><b${r.length>2?' class="s3"':""}>${r}</b><span><i>RUS</i><u></u></span></div></div>`};
function intro(){$("stage").classList.add("fresh");$("app").style.setProperty("--g","#8b8fa3");$("rn").textContent="Редкость";$("rn").style.color=$("rv").style.color="";$("rv").textContent="";$("bar").innerHTML="";$("tags").innerHTML="";$("pb").innerHTML='<div class="hint"><span>👆</span>Коснитесь экрана</div>'}
const dash=r=>[0,1,2,3,4].map(i=>`<i${i<=r?` style="background:${RL[r][1]}"`:""}></i>`).join("");
function toast(m){const t=$("ts");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1600)}

// генерация
function analyze(p){const cn=p.cn||"ru";if(cn==="ae")return anaAE(p);
 let m=1,t=[];const d=p.d,L=p.L,n=d.length,A=[...d].map(Number),u=new Set(d).size;
 if(u===1){m*=400;t.push(n+" одинаковые цифры");if(d[0]==="7")m*=2}
 else if(/^0+[1-9]$/.test(d)){m*=300;t.push("Малый номер")}
 else if(/^[1-9]0+$/.test(d)){m*=100;t.push("Круглый номер")}
 else if(A.every((x,i)=>!i||x===A[i-1]+1)){m*=80;t.push("Лесенка")}
 else if(d===[...d].reverse().join("")){m*=30;t.push("Зеркальные цифры")}
 else if(u<n){m*=3;t.push("Повтор цифр")}
 if(L.length>1){const lu=new Set(L).size;
  if(lu===1){m*=6;t.push("Одинаковые буквы")}else if(L.length===3&&L[0]===L[2]){m*=1.5;t.push("Палиндром букв")}else if(lu<L.length){m*=1.3;t.push("Повтор букв")}
  if(cn==="ru"&&L.length===3&&lu>1&&SER.includes(L)){m*=3;t.push("Блатная серия")}}
 if(cn==="ua"&&L===p.reg){m*=1.5;t.push("Серия как код региона")}
 // Foreign-country plates: beautiful combinations appear more often in the candidate pool,
 // while ordinary combinations retain their normal value.
 if(cn!=="ru"&&cn!=="ady"&&cn!=="ae"){
   if(n>=3&&u===1)m*=1.8;
   else if(n>=3&&(/^(\d)\1(\d)\2$/.test(d)||/^(\d)(\d)\1\2$/.test(d)))m*=1.45;
   if(L.length>=2&&new Set(L).size===1)m*=1.45;
   if(/^(123|234|345|456|567|678|789|007|077|100|200|500|700|777|888|999)$/.test(d))m*=1.35;
 }
 if(cn==="ady"&&/^(777|111|222|333|555|888|999|007|100)$/.test(d))m*=1.35;
 if(rm(p.reg,cn)>=1)t.push(cn==="ua"?"Киевский код":"Премиум регион");
 if(cn==="ru"&&p.ty!=="civ"){m*={taxi:1.5,pol:3,mil:4}[p.ty];t.unshift(TY[p.ty][0])}
 return{m,t,b:cn==="ua"?900:1500,cap:cn==="ua"?5e6:3e7}}
function anaAE(p){const d=p.d,n=d.length,u=new Set(d).size,A=[...d].map(Number),t=[["","Однозначный номер","Двузначный номер","Трёхзначный номер","Четырёхзначный номер","Пятизначный номер"][n]||""];
 let m=[0,22e6,15e5,12e4,12e3,2500][n]||2500;

   const floor=FTH[r];if(r>0)p.v=Math.min(a.cap,Math.max(p.v,floor));

   const digits=String(p.d||"");const letters=String(p.L||"");
   const repeated=(digits.length>1&&new Set(digits).size===1)||(letters.length>1&&new Set(letters).size===1);

   if(repeated||mirror)p.v=Math.min(a.cap,nice(p.v*1.35));

}

async function apiOnline(){try{const d=await apiReq("/api/players");const el=$("online-list");if(el)el.innerHTML=d.players.map(x=>`<div class="card"><b>${x.login}</b><small>${x.online?"● онлайн":"не в сети"}</small></div>`).join("")||'<p class="mut">Пока никого нет.</p>'}catch(e){toast("Сервер не подключён: "+e.message)}}
async function apiTransfer(){try{const id=$("tr-id").value.trim();await apiReq("/api/transfer",{to:$("tr-to").value,plateId:id});S.inv=S.inv.filter(p=>p.sid!==id&&txt(p).toUpperCase()!==id.toUpperCase());save();if(cur==="col")draw();toast("Номер передан")}catch(e){toast(e.message)}}
async function apiCreateAuction(){try{const plate=$("auc-plate").value.trim(),price=Number($("auc-price").value);if(!plate||!Number.isSafeInteger(price)||price<1)return toast("Укажи номер и целую цену больше нуля");await apiReq("/api/auctions",{plate,price});toast("Номер выставлен на аукцион");$("auc-plate").value="";$("auc-price").value="";apiAuctionList()}catch(e){toast(e.message)}}
async function apiAuctionList(){try{const d=await apiReq("/api/auctions"),el=$("auction-list"),mine=$("auction-mine");if(el)el.innerHTML=d.auctions.filter(x=>!x.mine).map(x=>`<div class="card"><div><b>${x.text}</b><p class="mut">${x.seller} · редкость ${x.rarity+1}/5</p><b>${rub(x.price)}</b></div><button class="pill" data-buy-auction="${x.id}">Купить</button></div>`).join("")||'<p class="mut">Сейчас нет чужих лотов.</p>';if(mine)mine.innerHTML=d.auctions.filter(x=>x.mine).map(x=>`<div class="card"><div><b>${x.text}</b><p class="mut">Твоя цена: ${rub(x.price)}</p></div><span class="mut">На продаже</span></div>`).join("")||'<p class="mut">Ты пока ничего не выставил.</p>'}catch(e){const el=$("auction-list");if(el)el.innerHTML=`<p class="mut">${e.message}</p>`}}
async function apiBuyAuction(id){try{const d=await apiReq("/api/auctions/"+id+"/buy",{});toast("Куплено: "+d.text);if(d.plate&&!S.inv.some(p=>p.sid===d.plate.id)){S.inv.unshift(mkV({cn:d.plate.country||"ru",L:d.plate.letters||"",d:d.plate.digits||"",reg:d.plate.region||"",ty:d.plate.type||"civ",r:d.plate.rarity||0,v:d.plate.value||d.price,sid:d.plate.id,id:"auc_"+d.plate.id,t0:Date.now()}));}apiAuctionList();try{const me=await apiReq("/api/me");if(me.user){S.m=me.user.rubles;save();hud()}}catch{}}catch(e){toast(e.message)}}
async function apiTrade(){try{await apiReq("/api/trades",{to:$("ex-to").value,myPlateId:$("ex-mine").value,theirPlateId:$("ex-theirs").value,cash:Number($("ex-cash").value||0),usd:Number($("ex-usd").value||0)});toast("Предложение отправлено")}catch(e){toast(e.message)}}
async function apiLookupPlates(){try{const login=encodeURIComponent($("ex-to").value.trim());const d=await apiReq("/api/players/"+login+"/plates");const el=$("other-plates");if(el)el.innerHTML=d.plates.map(p=>`<button class="card" data-copy-plate="${p.text}"><div><b>${p.text}</b><p class="mut">Номер: ${p.text}</p></div><span class="mut">Нажми, чтобы выбрать</span></button>`).join("")||'<p class="mut">У игрока пока нет номеров.</p>'}catch(e){toast(e.message)}}
async function apiTradeInbox(){try{const d=await apiReq("/api/trades");const el=$("trade-inbox");if(el)el.innerHTML=d.offers.map(o=>`<div class="card"><div><b>${o.from_login}: ${o.from_plate} ⇄ ${o.to_plate}</b><p class="mut">Доплата: ${o.cash} ₽ · ${o.dollars} $</p></div><button class="pill" data-accept-trade="${o.id}">Принять</button></div>`).join("")||'<p class="mut">Нет входящих предложений.</p>'}catch(e){toast(e.message)}}
async function apiAcceptTrade(id){try{await apiReq("/api/trades/"+id+"/accept",{});toast("Обмен завершён");apiTradeInbox()}catch(e){toast(e.message)}}

try{const b=apiBase();if($("as"))$("as").value=localStorage.getItem("nomera_api_base")||DEFAULT_API||(b&&/^https?:/.test(location.protocol)?"":b)}catch(e){}
(function(){let n=0,t;const h=$("auh");if(h)h.addEventListener("click",()=>{n++;clearTimeout(t);t=setTimeout(()=>n=0,2500);if(n>=7){n=0;$("as").style.display="block";toast("Режим настройки сервера")}})})();
intro();if(U&&LS.get("nomera_token")){loadU(U);$("au").classList.remove("on")}else{U="";LS.set("nomera_cur","");$("au").classList.add("on")}hud();setAuto();checkSession();
</script></body></html>
